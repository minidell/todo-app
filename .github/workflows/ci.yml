name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # test-only, not a secret
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TEST_ARGON2_FAST: "1"
      APP_ENV: dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff  # v6
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Run backend tests
        working-directory: backend
        run: uv run pytest

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U todo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://todo:todo@localhost:5432/todo
      TEST_DATABASE_URL: postgresql+asyncpg://todo:todo@localhost:5432/todo_test
      APP_ENV: dev
      # test-only, not a secret
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TEST_ARGON2_FAST: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff  # v6
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Reversibility gate — upgrade / downgrade / upgrade
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Autogenerate diff check (models must match migrations)
        working-directory: backend
        run: uv run alembic check
      - name: Create todo_test database
        run: PGPASSWORD=todo psql -h localhost -U todo -d postgres -c 'CREATE DATABASE todo_test;'
      - name: Run backend tests against Postgres
        working-directory: backend
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend component tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  ai-agent:
    runs-on: ubuntu-latest
    # No AI_AGENT_TOKEN here on purpose: ai-agent's own tests/conftest.py pins the
    # test token itself for its auth fixtures/assertions — this job must not set it
    # at job level, or it would fight what the test suite pins. AI_AGENT_LIVE stays
    # unset so the live-Ollama lane (tests/test_live_ollama.py) is skipped; no Ollama
    # runs in CI.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff  # v6
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install ai-agent dependencies
        working-directory: ai-agent
        run: uv sync --locked
      - name: Run ai-agent tests
        working-directory: ai-agent
        run: uv run pytest

  # Playwright E2E tests are intentionally not run in CI this iteration.
  # They will be executed locally during development and by the QA agent
  # on the integrated branch after backend and frontend are merged.
  # See docs/specs/iteration-2-slice-1-persistence-foundation.md (QA section) for details.
