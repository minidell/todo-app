# Included from nginx.conf's http{} block (see frontend/Dockerfile: this file becomes
# /etc/nginx/conf.d/default.conf), so directives here at top level are in http context.
# Caps how many simultaneous connections one client address may hold open — mainly
# aimed at /api/events (SSE, long-lived) so a single address cannot exhaust worker
# connections by opening an unbounded number of streams (slice-4 security review).
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

    # Docker's embedded DNS resolver. Using it (with a variable in proxy_pass, below)
    # instead of a bare hostname makes nginx resolve "backend" lazily per-request
    # rather than once at config load — so nginx still starts (and serves the SPA)
    # even if the backend container is briefly unavailable/restarting, and it picks
    # up a new container IP after a recreate without an nginx reload.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # One address may hold at most 32 concurrent connections here (SSE included).
        limit_conn perip 32;

        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE-safe: no buffering, long-lived connections (slice 4 realtime).
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
